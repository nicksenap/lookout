name: CI

on:
  push:
    branches: [main]
  pull_request:

# One job per gate so they run in parallel and a failure names itself. `bun run check` runs the
# same scripts in sequence locally; add a new check there and as a job here.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ls node_modules/@types node_modules/ink/build/components/StdoutContext.d.ts && bunx tsc --version && bunx tsc --showConfig | head -30 && bunx tsc --noEmit --explainFiles | grep -i "@types/node/\|ink/build/components/StdoutContext\|bun-types" | head
      - run: bun run typecheck

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run lint

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run complexity

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run knip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun test

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run fixtures:check
