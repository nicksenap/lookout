name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each step is one script from package.json so a failure names the gate. `bun run check`
# runs the same steps locally; add new checks there and here together.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: biome
        run: bun run lint
      - name: complexity
        run: bun run complexity
      - name: knip
        run: bun run knip
      - name: test
        run: bun test
      - name: fixtures drift
        run: bun run fixtures:check
